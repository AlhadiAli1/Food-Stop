<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Food Stop logo">
  <defs>
    <linearGradient id="bunG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f0e3"/>
      <stop offset="1" stop-color="#d9cfbe"/>
    </linearGradient>
    <linearGradient id="pattyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4631"/>
      <stop offset="1" stop-color="#3b2f22"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <circle cx="110" cy="110" r="102" fill="#1a1712"/>
  <circle cx="110" cy="110" r="102" fill="none" stroke="#e8762c" stroke-width="5"/>

  <!-- burger -->
  <!-- top bun -->
  <path d="M60 92 Q110 60 160 92 L160 100 L60 100 Z" fill="url(#bunG)"/>
  <!-- sesame seeds -->
  <ellipse cx="92" cy="84" rx="4" ry="2.6" fill="#12100d" opacity="0.22"/>
  <ellipse cx="112" cy="78" rx="4" ry="2.6" fill="#12100d" opacity="0.22"/>
  <ellipse cx="132" cy="83" rx="4" ry="2.6" fill="#12100d" opacity="0.22"/>
  <!-- cheese -->
  <path d="M62 104 L96 110 L158 104 L158 112 L62 112 Z" fill="#e8762c" opacity="0.75"/>
  <!-- patty -->
  <rect x="66" y="116" width="88" height="18" rx="8" fill="url(#pattyG)"/>
  <!-- lower bun -->
  <path d="M70 138 Q110 152 150 138 L146 150 Q110 162 74 150 Z" fill="#c6bbaa"/>
  <!-- highlight -->
  <path d="M78 92 Q110 70 142 92 Z" fill="#12100d" opacity="0.1"/>

  <!-- steam -->
  <path d="M96 58 q4 -7 0 -12" stroke="#e8762c" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M112 54 q4 -7 0 -12" stroke="#e8762c" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- sparkle -->
  <g fill="#e8762c">
    <circle cx="78" cy="78" r="3"/>
    <circle cx="146" cy="80" r="2.4"/>
  </g>
</svg>